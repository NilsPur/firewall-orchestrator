mutation addAiSession($userId: Int!, $name: String!, $systemPrompt: String!, $modelId: String!, $providerId: bigint!) {
  insert_ai_session(objects: {
    user_id: $userId,
    name: $name,
    system_prompt: $systemPrompt,
    model_id: $modelId,
    provider_id: $providerId
  }) {
    returning {
      newIdLong: id
    }
  }
}
