mutation saveAiSettings($configItems: [config_insert_input!]!, $provider: ai_provider_insert_input!, $model: ai_model_insert_input!) {
  insert_config(objects: $configItems, on_conflict: {constraint: config_pkey, update_columns: [config_value]}) {
    affected_rows
  }
  delete_ai_model(where: {}) {
    affected_rows
  }
  delete_ai_provider(where: {id: {_neq: 1}}) {
    affected_rows
  }
  insert_ai_provider_one(object: $provider, on_conflict: {constraint: ai_provider_pkey, update_columns: [kind, display_name, endpoint_url, api_key_env_variable, timeout_seconds, max_retries]}) {
    id
  }
  insert_ai_model_one(object: $model) {
    id
  }
}
