<VirtualHost *:{{ middleware_web_listener_port }}>
	ServerName {{ middleware_hostname }}:{{ middleware_web_listener_port }}
	ServerAdmin {{ server_admin }}
	Timeout {{ apache_mw_timeout }}

	# the jwt is sent in the "Authorization" header and grows with the permissions of the user,
	# so raise the per-header limit from the 8190 byte default to the kestrel default of 32KB
	LimitRequestFieldSize {{ apache_limit_request_field_size }}

	ProxyPreserveHost On
{% if ai_server_on_host | bool %}
	# the MCP endpoint of the ai mcp server on this host (roles/ai), under the same path it is mapped
	# to there, so nothing is rewritten. Listed before "/" because Apache uses the first ProxyPass
	# that matches. MCP answers may be event streams, so every event is passed on at once.
	# The request body size is limited by the ai mcp server itself: a LimitRequestBody here would
	# answer an oversized body with 500 or 502 instead of 413, because the proxy has already
	# connected to the ai mcp server when it notices.
	ProxyPass {{ ai_mcp_path }} {{ ai_mcp_native_mcp_uri }} flushpackets=on
	ProxyPassReverse {{ ai_mcp_path }} {{ ai_mcp_native_mcp_uri }}

	# the AG-UI endpoint of the ai harness on this host (roles/ai), likewise under its own path and
	# before "/". A run answers with server-sent events, passed on at once; the wait for the next
	# event is bounded by the Timeout above. The harness limits the request body size itself.
	ProxyPass {{ ai_harness_agui_path }} {{ ai_harness_native_agui_uri }} flushpackets=on
	ProxyPassReverse {{ ai_harness_agui_path }} {{ ai_harness_native_agui_uri }}

{% endif %}
	# the very url the middleware binds to, so the proxy target and the listener
	# cannot drift apart - it is written to fworch.json as middleware_native_uri
	ProxyPass / {{ middleware_native_uri }}
	ProxyPassReverse / {{ middleware_native_uri }}

	ErrorLog /var/log/{{ webserver_package_name }}/error.log
	TransferLog /var/log/{{ webserver_package_name }}/access.log
	CustomLog /var/log/{{ webserver_package_name }}/ssl_request_log "%t %h %{SSL_PROTOCOL}x %{SSL_CIPHER}x \"%r\" %b"
	
	SSLEngine on
	{{ apache_ssl_protocol }}
	{{ apache_ssl_cipher_suite }}
	SSLCertificateFile {{ internalca_apache_certificate }}
	SSLCertificateKeyFile {{ internalca_apache_private_key }}
{% if internalca_apache_intermediate_certificates | length > 0 %}
	SSLCertificateChainFile {{ internalca_apache_intermediate_certificates }}
{% endif %}

    # --- Security Headers ---
<IfModule mod_headers.c>
	RequestHeader set X-Forwarded-Proto "https"
{% for header in apache_security_headers %}
    {{ header }}
{% endfor %}
</IfModule>

</VirtualHost>
