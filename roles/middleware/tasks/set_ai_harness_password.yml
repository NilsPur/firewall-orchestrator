# The ai harness logs in with a technical user of its own (role ai-harness) to read the ai settings and the
# credential they reference. Its user is part of the ldap tree (tree_operators.ldif.j2, upgrade/9.8.1.ldif.j2),
# so these tasks run after the tree was set up or upgraded. The password file is only created if it is missing,
# and setting the same password in ldap again changes nothing, so the tasks can run on every installer run;
# they also set the password of an installation that gets the ai server only later.

- name: write a random ai harness password to the secrets directory unless it exists
  copy:
    content: "{{ randomly_generated_pwd }}\n"
    dest: "{{ ai_harness_password_file }}"
    mode: "0600"
    owner: "{{ fworch_user }}"
    group: "{{ fworch_group }}"
    force: false
  become: true
  no_log: true

- name: read the ai harness password from the secrets directory
  slurp:
    src: "{{ ai_harness_password_file }}"
  register: ai_harness_password_slurp
  become: true
  no_log: true

- name: set the ai harness password in ldap
  ldap_passwd:
    dn: "{{ ai_harness_user_dn }}"
    passwd: "{{ ai_harness_password_slurp.content | b64decode | trim }}"
    server_uri: "{{ openldap_url }}"
    bind_dn: "{{ openldap_superuser_dn }}"
    bind_pw: "{{ ldap_manager_pwd }}"
    validate_certs: "{{ ldap_verify_certs }}"
    ca_path: "{{ ldap_module_ca_path }}"
  become: true
  no_log: true
